name: Microservice A CI/CD (Optimized)

# 1. 실행 조건
on:
  push:
    branches:
      - dev
  workflow_dispatch:

# 2. 전역 변수
env:
  REGISTRY_OWNER: nhnacademy-be12-trillion # 조직 이름
  REGISTRY: ghcr.io
  IMAGE_NAME: eureka
  JAVA_VERSION: '21'

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # 패키지 등록 권한 필수

    steps:
      - name: 📦 Checkout Code
        uses: actions/checkout@v4

      # --- 1. Java 환경 설정 및 JAR 파일 빌드 (⭐ Maven용으로 수정) ---
      - name: ⚙️ Set up Java and Build JAR
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'
          # Maven 프로젝트는 'maven' 캐시를 사용합니다.
          cache: 'maven'

      - name: 🔨 Build JAR file with Maven
        run: |
          # Maven 빌드 실행 (JAR 파일 생성: target/*.jar)
          mvn clean package -DskipTests

      # --- 2. Docker 이미지 빌드 및 푸시 ---
      - name: 🔑 Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          # ${GITHUB_ACTOR}를 사용하면 현재 워크플로우 실행자의 GitHub 계정 이름으로 로그인됩니다.
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
          registry: ${{ env.REGISTRY }}

      - name: 🏷️ Set up image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.REGISTRY_OWNER }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=,suffix=,format=short
            type=raw,value=latest,enable=true

      - name: 🔨 Build and Push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}

      # --- 3. 파일 전송 및 원격 배포 (스크립트 최적화) ---
      - name: 📡 Transfer and Deploy via SSH (Optimized)
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          # private_key 대신 password를 사용하면 보안에 취약할 수 있으므로
          # scp-action에서 key를 사용했듯이 key를 사용하는 것을 권장합니다.
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          # docker-compose.yml 전송과 SSH 배포를 하나의 액션으로 처리하여 줄였습니다.
          script: |
            # 1. 파일 전송 (scp 명령어로 직접 처리)
            echo "Transferring docker-compose.yml..."
            scp -o StrictHostKeyChecking=no docker-compose.yml ${{ secrets.SSH_USERNAME }}@${{ secrets.SSH_HOST }}:~/msa-project/
            
            echo "SSH 접속 및 배포 디렉토리 이동..."
            cd ~/msa-project
            
            echo "Docker Registry 로그인..."
            # DOCKER_PAT 대신 GITHUB_TOKEN을 재활용하여 secrets 개수를 줄일 수 있습니다.
            echo ${{ secrets.DOCKER_PAT }} | docker login ${{ env.REGISTRY }} -u ${{ env.REGISTRY_OWNER }} --password-stdin
            
            echo "최신 이미지 Pull 및 컨테이너 재실행..."
            docker-compose pull eureka-peer1 eureka-peer2 # 명령어를 하나로 통합
            docker-compose up -d
            
            echo "Eureka Cluster 배포 완료!"