name: Microservice A CI/CD (Optimized)

# 1. 실행 조건
on:
  push:
    branches:
      - dev
  workflow_dispatch:

# 2. 전역 변수
env:
  REGISTRY_OWNER: nhnacademy-be12-trillion # 조직 이름
  REGISTRY: ghcr.io
  IMAGE_NAME: eureka
  JAVA_VERSION: '21'
  DEPLOY_DIR: ~/msa-project

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # 패키지 등록 권한 필수

    steps:
      - name: 📦 Checkout Code
        uses: actions/checkout@v4

      # --- 1. Java 환경 설정 및 JAR 파일 빌드 (⭐ Maven용으로 수정) ---
      - name: ⚙️ Set up Java and Build JAR
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'
          cache: 'maven'

      - name: 🔨 Build JAR file with Maven
        run: |
          mvn clean package -DskipTests

      # --- 2. Docker 이미지 빌드 및 푸시 ---
      - name: 🔑 Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          username: ${{ env.REGISTRY_OWNER }}
          password: ${{ secrets.GHCR_TOKEN }}
          registry: ${{ env.REGISTRY }}

      - name: 🏷️ Set up image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.REGISTRY_OWNER }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=,suffix=,format=short
            type=raw,value=latest,enable=true

      - name: 🔨 Build and Push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}

      - name: Transfer docker-compose.yml
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_IP }}
          username: ${{ secrets.SSH_ID }}
          password: ${{ secrets.SSH_PASSWORD }}
          port: ${{ secrets.SSH_PORT }}
          source: "docker-compose.yml"
          target: "${{ env.DEPLOY_DIR }}"


      # --- 3. 파일 전송 및 원격 배포 ---
      - name: 📡 Transfer and Deploy via SSH (Optimized)
        uses: appleboy/ssh-action@v1.0.3

        with:
          host: ${{ secrets.SSH_IP }}
          username: ${{ secrets.SSH_ID }}
          password: ${{ secrets.SSH_PASSWORD }}
          port: ${{ secrets.SSH_PORT }}
          script: |
            SERVICE_NAME1="eureka-peer1"
            SERVICE_NAME2="eureka-peer2"
            
            
            echo "SSH 접속 및 배포 디렉토리 이동..."
            mkdir -p ${{ env.DEPLOY_DIR }}
            cd ${{ env.DEPLOY_DIR }}
            
            lsof -t -i :10419 | xargs -r kill -9
  
            echo "기존 컨테이너 정리..."
            docker-compose down
            
            echo "Docker Registry 로그인..."
            echo ${{secrets.GHCR_TOKEN}} | docker login ${{ env.REGISTRY }} -u ${{ env.REGISTRY_OWNER }} --password-stdin
            
            echo "최신 이미지 Pull 및 Peer1 재실행..."
            docker-compose pull ${SERVICE_NAME1}
            docker-compose up -d --no-deps --force-recreate ${SERVICE_NAME1}

            lsof -t -i :10420 | xargs -r kill -9
            
            echo "최신 이미지 Pull 및 Peer2 재실행..."
            docker-compose pull ${SERVICE_NAME2}
            docker-compose up -d --no-deps --force-recreate ${SERVICE_NAME2}
            
            docker logout ${{ env.REGISTRY }}
            
            echo "Eureka Cluster 롤링 배포 완료!"