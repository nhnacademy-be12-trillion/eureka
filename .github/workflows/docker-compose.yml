name: CI/CD Pipeline for Microservice A

# 1. 언제 실행될지 정의합니다.
on:
  push:
    branches:
      - dev
  workflow_dispatch: # 수동 실행을 허용합니다.

# 2. 전역 변수를 정의합니다.
env:
  # 여러분의 GitHub 계정 이름
  REGISTRY_OWNER: serrot24
  # GitHub Packages 레지스트리 주소
  REGISTRY: ghcr.io
  # 빌드할 도커 이미지 이름 (소문자로 작성)
  IMAGE_NAME: eureka

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    # 환경 변수에서 사용될 GitHub 토큰 권한을 설정합니다.
    permissions:
      contents: read
      packages: write

    steps:
      - name: 📦 Checkout Code
        uses: actions/checkout@v4

      # --- Docker 빌드 및 푸시 단계 ---

      - name: 🔑 Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          username: serrot24
          password: ${{ secrets.GITHUB_TOKEN }}
          registry: ${{ env.REGISTRY }}

      - name: 🏷️ Set up image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.REGISTRY_OWNER }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=,suffix=,format=short
            type=raw,value=latest,enable=true

      - name: 🔨 Build and Push Docker image
        uses: docker/build-push-action@v5
        with:
          context: . # Dockerfile이 있는 경로
          push: true
          tags: ${{ steps.meta.outputs.tags }}


            # --- 파일 전송 단계 추가 ---
      - name: 📁 Transfer Docker Compose File via SCP
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          # 1. 보낼 파일 (로컬 저장소의 루트 디렉토리에 있다고 가정)
          source: "docker-compose.yml"
          # 2. 서버에 저장할 위치
          target: "~/msa-project/"
          # 3. 파일 전송 전, 서버에 대상 디렉토리가 없으면 생성합니다.
          strip_components: 0

      # --- SSH 원격 배포 단계 ---

      - name: 📡 Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          password: ${{ secrets.SSH_PASSWORD }}
          script: |
            echo "SSH 접속 성공. 배포 디렉토리로 이동..."
            cd ~/msa-project # 전송한 파일이 있는 디렉토리로 이동
            
            echo "Docker Registry 로그인..."
            echo ${{ secrets.DOCKER_PAT }} | docker login ${{ env.REGISTRY }} -u ${{ env.REGISTRY_OWNER }} --password-stdin
            
            echo "최신 이미지 Pull..."
            docker-compose pull eureka-peer1
            docker-compose pull eureka-peer2
            
            echo "컨테이너 재실행 (변경된 서비스만)..."
            docker-compose up -d
            
            echo "Eureka Cluster 배포 완료!"





