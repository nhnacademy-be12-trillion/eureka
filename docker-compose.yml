version: '3.8'

services:
  config-server:
    image: ghcr.io/nhnacademy-be12-trillion/config-server:latest
    container_name: config-server
    ports:
      - "10418:10418"
    environment:
      - EUREKA_URL=http://be12-team1:nhnacademy123!@eureka-peer1:10419/eureka/,http://be12-team1:nhnacademy123!@eureka-peer2:10420/eureka/
      - SERVER_PORT=10418
      - SPRING_CLOUD_CONFIG_SERVER_GIT_PRIVATEKEY=${CONFIG_SERVER_PRIVATE_KEY}
      - SPRING_CLOUD_CONFIG_SERVER_GIT_URI=git@github.com:nhnacademy-be12-trillion/config-repo.git
      - SPRING_CLOUD_CONFIG_SERVER_GIT_IGNORELOCALSSHSETTINGS=true
    networks:
      - msa-network

  # 첫 번째 유레카 서버 (포트 10419)
  eureka-peer1:
    image: ghcr.io/nhnacademy-be12-trillion/eureka:latest
    container_name: eureka-peer1
    ports:
      - "10419:10419" # 호스트포트:컨테이너포트
    environment:
      - SERVER_PORT=10419
      # 중요: 도커 내부에서는 localhost가 아닌 '서비스 이름(eureka-peer2)'으로 통신해야 합니다.
      - EUREKA_PEER_URL=http://be12-team1:nhnacademy123!@eureka-peer2:10420/eureka/
    networks:
      - msa-network

  # 두 번째 유레카 서버 (포트 10420)
  eureka-peer2:
    image: ghcr.io/nhnacademy-be12-trillion/eureka:latest
    container_name: eureka-peer2
    ports:
      - "10420:10420"
    environment:
      - SERVER_PORT=10420
      # 중요: Peer1을 바라보도록 설정
      - EUREKA_PEER_URL=http://be12-team1:nhnacademy123!@eureka-peer1:10419/eureka/
    networks:
      - msa-network

  gateway-peer1:
    image: ghcr.io/nhnacademy-be12-trillion/gateway:latest
    container_name: gateway-peer1
    ports:
      - "10400:10400"
    environment:
      - SERVER_PORT=10400
      - EUREKA_URL=http://be12-team1:nhnacademy123!@eureka-peer1:10419/eureka/,http://be12-team1:nhnacademy123!@eureka-peer2:10420/eureka/
      - CONFIG_SERVER_URI=http://be12-team1:nhnacademy123!@config-server:10418/
    networks:
      - msa-network

  gateway-peer2:
