spring:
  application:
    name: eureka
  lifecycle:
    timeout-per-shutdown-phase: 10s
  security:
    user:
      name: be12-team1
      password: nhnacademy123!

server:
  shutdown: graceful
  port: ${SERVER_PORT:10419}

eureka:
  server:
    peer-node-read-timeout-ms: 5000

  client:
    register-with-eureka: true
    fetch-registry: true
    service-url:
      defaultZone: ${EUREKA_PEER_URL}

  instance:
    prefer-ip-address: true
    instance-id: ${spring.application.name}:${HOSTNAME_ENV}:${server.port}
    hostname: ${HOSTNAME_ENV:localhost}
    registry:
      default-open-for-traffic-count: 0

management:
  endpoints:
    web:
      exposure:
        include: "health,info,prometheus"

logging:
  pattern:
    level: "%d{yyyy-MM-dd HH:mm:ss.SSS} %5p [${spring.application.name:},%X{traceId:-},%X{spanId:-}]"
  level:
    root: INFO
    com.netflix.discovery: WARN
    com.netflix.eureka: WARN
