spring:
  application:
    name: eureka

eureka:
  client:
    #MSA서비스 Eureka에 자신의 정보를 저장해야함
    register-with-eureka: true
    #MSA서비스 Eureka의 레지스트리 목록을 조회 저장해야함
    fetch-registry: true

#    Eureka 클러스터 주소 설정
    service-url:
      defaultZone: \
        http://${spring.security.user.name}:${spring.security.user.password}@127.0.0.1:10419/eureka/, \
        http://${spring.security.user.name}:${spring.security.user.password}@127.0.0.1:10420/eureka/

  instance:
    prefer-ip-address: true
    instance-id: ${spring.application.name}:${server.port}

    # ----------------------------------------------------
    # Config Server 설정 (운영 환경에서는 사용 권장)  -> Eureka 설정 이후 Config Server 세팅 예정
    # ----------------------------------------------------
